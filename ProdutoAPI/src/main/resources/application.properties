spring.application.name=AulaAPI

# ---- Banco de dados em memoria (H2) ----
spring.datasource.url=jdbc:h2:mem:auladb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console web do H2: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---- Erros ----
# nao expor stacktrace nas respostas de erro
server.error.include-stacktrace=never
